server:
  port: 8080

spring:
  application:
    name: sentinel-mcp
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://sentinel-postgres:5432/sentinel_rag
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  ai:
    ollama:
      base-url: http://sentinel-ollama:11434
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
    mcp:
      server:
        name: sentinel-incident-triage
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE

sentinel:
  log-provider: mock
  loki:
    url: http://localhost:3100
  elasticsearch:
    url: http://localhost:9200
  rag:
    similarity-threshold: 0.55
    top-k: 4
