services:
  sentinel-postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentinel-ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped

  ollama-model-puller:
    image: curlimages/curl:latest
    container_name: ollama-model-puller
    depends_on:
      - sentinel-ollama
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Ollama service to start...';
        while ! nc -z sentinel-ollama 11434; do sleep 2; done;
        echo 'Ollama is online. Pulling nomic-embed-text...';
        curl -X POST http://sentinel-ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}';
        echo 'Model pulled successfully.';
      "

  sentinel-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-mcp
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SENTINEL_LOG_PROVIDER=${SENTINEL_LOG_PROVIDER:-mock}
      - SENTINEL_LOKI_URL=${SENTINEL_LOKI_URL:-http://localhost:3100}
      - SENTINEL_ELASTICSEARCH_URL=${SENTINEL_ELASTICSEARCH_URL:-http://localhost:9200}
    depends_on:
      - sentinel-postgres
      - ollama-model-puller

volumes:
  pgdata:
  ollamadata:
